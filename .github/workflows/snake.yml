name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: jwaan01
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0f0f14&color_dots=#efeadf,#ffc7cf,#f2788a,#e3203b,#b3121f
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffd60a&color_dots=#161b22,#5c1a24,#8f1d2e,#c41f36,#e3203b
            dist/github-contribution-grid-snake.gif?color_snake=#0f0f14&color_dots=#efeadf,#ffc7cf,#f2788a,#e3203b,#b3121f

      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
