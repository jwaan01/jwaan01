<svg width="1100" height="350" viewBox="0 0 1100 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Freelance Services">
<title>Freelance Services</title>
<style>

.h{font:700 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9}
.sub{font:400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.ct{font:700 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC}
.cd{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.card{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ic{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ul{stroke-dasharray:120;stroke-dashoffset:120;animation:ul 1s ease .3s forwards}
@keyframes ul{to{stroke-dashoffset:0}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-400px) skewX(-20deg)}50%,100%{transform:translateX(1400px) skewX(-20deg)}}
.comet{stroke-dasharray:90 910;stroke-dashoffset:1000;animation:comet linear infinite}@keyframes comet{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="350" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1020"/><stop offset="1" stop-color="#1E293B"/>
  </linearGradient>
  <linearGradient id="cardF" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="1100" height="350" rx="22"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#clip)">
  <rect width="1100" height="350" fill="url(#bg)"/>
  <text x="48" y="60" class="h">Freelance Services</text>
  <line x1="48" y1="74" x2="168" y2="74" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" class="ul"/>
  <text x="48" y="100" class="sub">Production-focused solutions for startup and business clients</text>
  <g class="card" style="animation-delay:0.20s"><rect x="40" y="126" width="320" height="84" rx="14" fill="url(#cardF)"/><path d="M54,126 H346 A14,14 0 0 1 360,140 V196 A14,14 0 0 1 346,210 H54 A14,14 0 0 1 40,196 V140 A14,14 0 0 1 54,126 Z" stroke="#22C55E" stroke-opacity="0.28" stroke-width="1.2"/><path d="M54,126 H346 A14,14 0 0 1 360,140 V196 A14,14 0 0 1 346,210 H54 A14,14 0 0 1 40,196 V140 A14,14 0 0 1 54,126 Z" pathLength="1000" class="comet" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:5.0s;animation-delay:0.0s"/><circle cx="78" cy="168" r="22" fill="#22C55E" fill-opacity=".12"/><g transform="translate(78 168)"><g class="ic" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle r="11"/><ellipse rx="5" ry="11"/><line x1="-11" x2="11"/></g></g><text x="114" y="163" class="ct">Business Websites</text><text x="114" y="186" class="cd">Landing pages, company sites, UX</text></g><g class="card" style="animation-delay:0.35s"><rect x="390" y="126" width="320" height="84" rx="14" fill="url(#cardF)"/><path d="M404,126 H696 A14,14 0 0 1 710,140 V196 A14,14 0 0 1 696,210 H404 A14,14 0 0 1 390,196 V140 A14,14 0 0 1 404,126 Z" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="1.2"/><path d="M404,126 H696 A14,14 0 0 1 710,140 V196 A14,14 0 0 1 696,210 H404 A14,14 0 0 1 390,196 V140 A14,14 0 0 1 404,126 Z" pathLength="1000" class="comet" stroke="#3B82F6" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:5.7s;animation-delay:-1.3s"/><circle cx="428" cy="168" r="22" fill="#3B82F6" fill-opacity=".12"/><g transform="translate(428 168)"><g class="ic" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-11 11 V-11 M-11 11 H11"/><path d="M-6 5 L-1 -2 L3 2 L10 -7"/></g></g><text x="464" y="163" class="ct">Dashboards &amp; Admin</text><text x="464" y="186" class="cd">Internal tools, analytics, workflows</text></g><g class="card" style="animation-delay:0.50s"><rect x="740" y="126" width="320" height="84" rx="14" fill="url(#cardF)"/><path d="M754,126 H1046 A14,14 0 0 1 1060,140 V196 A14,14 0 0 1 1046,210 H754 A14,14 0 0 1 740,196 V140 A14,14 0 0 1 754,126 Z" stroke="#A855F7" stroke-opacity="0.28" stroke-width="1.2"/><path d="M754,126 H1046 A14,14 0 0 1 1060,140 V196 A14,14 0 0 1 1046,210 H754 A14,14 0 0 1 740,196 V140 A14,14 0 0 1 754,126 Z" pathLength="1000" class="comet" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:6.4s;animation-delay:-2.6s"/><circle cx="778" cy="168" r="22" fill="#A855F7" fill-opacity=".12"/><g transform="translate(778 168)"><g class="ic" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-12 -9 H-8 L-4 6 H8 L11 -4 H-6"/><circle cx="-2" cy="10" r="1.6"/><circle cx="6" cy="10" r="1.6"/></g></g><text x="814" y="163" class="ct">E-commerce Systems</text><text x="814" y="186" class="cd">Catalog, cart, checkout, orders</text></g><g class="card" style="animation-delay:0.65s"><rect x="40" y="228" width="495" height="84" rx="14" fill="url(#cardF)"/><path d="M54,228 H521 A14,14 0 0 1 535,242 V298 A14,14 0 0 1 521,312 H54 A14,14 0 0 1 40,298 V242 A14,14 0 0 1 54,228 Z" stroke="#06B6D4" stroke-opacity="0.28" stroke-width="1.2"/><path d="M54,228 H521 A14,14 0 0 1 535,242 V298 A14,14 0 0 1 521,312 H54 A14,14 0 0 1 40,298 V242 A14,14 0 0 1 54,228 Z" pathLength="1000" class="comet" stroke="#06B6D4" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:7.1s;animation-delay:-3.9000000000000004s"/><circle cx="78" cy="270" r="22" fill="#06B6D4" fill-opacity=".12"/><g transform="translate(78 270)"><g class="ic" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-5 -12 V-5 M5 -12 V-5 M-9 -5 H9 V1 A9 9 0 0 1 -9 1 Z M0 10 V14"/></g></g><text x="114" y="265" class="ct">API Integrations &amp; Automation</text><text x="114" y="288" class="cd">Payments, third-party APIs, custom workflow automation</text></g><g class="card" style="animation-delay:0.80s"><rect x="565" y="228" width="495" height="84" rx="14" fill="url(#cardF)"/><path d="M579,228 H1046 A14,14 0 0 1 1060,242 V298 A14,14 0 0 1 1046,312 H579 A14,14 0 0 1 565,298 V242 A14,14 0 0 1 579,228 Z" stroke="#F97316" stroke-opacity="0.28" stroke-width="1.2"/><path d="M579,228 H1046 A14,14 0 0 1 1060,242 V298 A14,14 0 0 1 1046,312 H579 A14,14 0 0 1 565,298 V242 A14,14 0 0 1 579,228 Z" pathLength="1000" class="comet" stroke="#F97316" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:7.8s;animation-delay:-5.2s"/><circle cx="603" cy="270" r="22" fill="#F97316" fill-opacity=".12"/><g transform="translate(603 270)"><g class="ic" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 -12 L-8 2 H0 L-2 12 L8 -2 H0 Z"/></g></g><text x="639" y="265" class="ct">Performance &amp; Refactoring</text><text x="639" y="288" class="cd">Speed optimization, maintainability, code cleanup</text></g>
  <rect class="shine" x="0" y="0" width="160" height="350" fill="url(#sh)"/>
</g>

</svg>
