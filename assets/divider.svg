<svg width="1000" height="24" viewBox="0 0 1000 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
<title>divider</title>
<style>
.run{animation:run 4s cubic-bezier(.6,0,.4,1) infinite}@keyframes run{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}.d{animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
</style>

<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#34D399"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
</linearGradient></defs>
<line x1="0" y1="12" x2="1000" y2="12" stroke="#1E293B" stroke-width="2"/>
<rect class="run" x="0" y="10.5" width="260" height="3" rx="1.5" fill="url(#g)"/>
<rect class="d" x="495.0" y="7" width="10" height="10" transform="rotate(45 500.0 12)" fill="#0B1020" stroke="#34D399" stroke-width="2"/>

</svg>
