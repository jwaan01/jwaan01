<svg width="1000" height="36" viewBox="0 0 1000 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
<title>divider</title>
<style>@font-face{font-family:HTLabel;font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.sfx{font-family:HTSfx,'Arial Black', Impact, sans-serif}
.hd{font-family:HTHead,'Arial Narrow', Impact, sans-serif;font-weight:900;font-style:italic;text-transform:uppercase}
.lb{font-family:HTLabel,'Arial Narrow', Arial, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:2px}
.bd{font-family:HTBody,'Segoe UI', Arial, sans-serif;font-weight:400}
.bd6{font-family:HTBodySemi,'Segoe UI', Arial, sans-serif;font-weight:600}
.dp{font-family:VDDisplay,Impact, 'Arial Narrow', sans-serif;font-weight:400}
.fb{transform-box:fill-box;transform-origin:center}
.spd{animation:spd linear infinite}
@keyframes spd{from{transform:translateX(160px);opacity:0}20%{opacity:1}to{transform:translateX(-220px);opacity:0}}
.jit{animation:jit .32s steps(1) infinite}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-1px,2px)}75%{transform:translate(-2px,-1px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick 1.6s steps(2) infinite}
@keyframes flick{50%{opacity:.55}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes pop{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
@keyframes slamL{from{transform:translateX(-120%)}to{transform:none}}
@keyframes slamR{from{transform:translateX(110%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}

.run{animation:run 2.6s cubic-bezier(.7,0,.3,1) infinite}@keyframes run{from{transform:translateX(-200px)}to{transform:translateX(1100px)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style>
<defs><pattern id="tone" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#0f0f14"/></pattern><pattern id="toneW" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#ffffff"/></pattern><pattern id="toneF" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" fill="#0f0f14"/></pattern><linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cd"><rect x="2" y="8" width="996" height="20"/></clipPath></defs>

<polygon points="0.0,6.0 1000.0,6.0 1000.0,30.0 0.0,30.0" fill="#fbf8f1" stroke="#0f0f14" stroke-width="4"/>
<g clip-path="url(#cd)"><g class="run"><polygon points="10.0,8.0 180.0,8.0 170.0,28.0 0.0,28.0" fill="#e3203b"/></g></g>
<g transform="translate(500.0 18)"><g><polygon points="-41.0,-15.0 50.0,-15.0 41.0,15.0 -50.0,15.0" fill="#0f0f14" transform="translate(4 4)"/><polygon points="-41.0,-15.0 50.0,-15.0 41.0,15.0 -50.0,15.0" fill="#ffd60a" stroke="#0f0f14" stroke-width="4" stroke-linejoin="miter"/></g></g>
<text x="500.0" y="24" data-box="459.0 3 541.0 33" text-anchor="middle" class="lb" font-size="16" fill="#0f0f14" data-ink="0.250 0.167">NEXT</text>

</svg>
