<svg width="1000" height="400" viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack">
<title>Tech stack</title>
<style>

.r1{transform-origin:230px 200px;animation:spin 24s linear infinite}
.r2{transform-origin:230px 200px;animation:spin 36s linear infinite reverse}
.r1-c{animation:spin 24s linear infinite reverse}
.r2-c{animation:spin 36s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{font:600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#E2E8F0}
.core{transform-origin:230px 200px;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.ping{transform-origin:230px 200px;animation:ping 3s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.7}to{transform:scale(2.6);opacity:0}}
.track{stroke-dasharray:4 8;animation:dash 20s linear infinite}
@keyframes dash{to{stroke-dashoffset:-240}}
.h{font:700 30px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9}
.sub{font:400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.cat{font:700 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;letter-spacing:3px;opacity:0;animation:fadeup .6s ease forwards}
.bar{stroke-dasharray:450;stroke-dashoffset:450;animation:bar 1.2s cubic-bezier(.6,0,.2,1) forwards}
@keyframes bar{to{stroke-dashoffset:0}}
.pill{opacity:0;animation:fadeup .5s cubic-bezier(.2,.8,.2,1.2) forwards}
.pt{font:600 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#E2E8F0}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sweep{transform-origin:230px 200px;animation:spin 6s linear infinite}
.comet{stroke-dasharray:90 910;stroke-dashoffset:1000;animation:comet linear infinite}@keyframes comet{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1020"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="coreG"><stop stop-color="#34D399"/><stop offset=".6" stop-color="#0EA5E9"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".35"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="400" rx="22" fill="url(#bg)"/>
<path class="sweep" d="M230 200 L418 200 A188 188 0 0 0 385.2 93.8 Z" fill="url(#sw)" opacity=".5"/>
<circle cx="230" cy="200" r="100" stroke="#22D3EE" stroke-opacity=".35" class="track"/>
<circle cx="230" cy="200" r="168" stroke="#A78BFA" stroke-opacity=".3" class="track" style="animation-direction:reverse"/>
<circle cx="230" cy="200" r="34" fill="none" stroke="#34D399" class="ping"/>
<circle cx="230" cy="200" r="34" fill="none" stroke="#34D399" class="ping" style="animation-delay:1.5s"/>
<g class="core" filter="url(#glow)">
  <circle cx="230" cy="200" r="42" fill="url(#coreG)" opacity=".55"/>
  <circle cx="230" cy="200" r="30" fill="#0B1220" stroke="#34D399" stroke-width="2"/>
  <text x="230" y="207" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="20" fill="#6EE7B7">&lt;/&gt;</text>
</g>
<g class="r1"><g transform="translate(330.0 200.0)"><g class="r1-c"><rect x="-29.5" y="-14" width="59.0" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">React</text></g></g><g transform="translate(230.0 300.0)"><g class="r1-c"><rect x="-38.1" y="-14" width="76.2" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">Node.js</text></g></g><g transform="translate(130.0 200.0)"><g class="r1-c"><rect x="-33.8" y="-14" width="67.6" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">Python</text></g></g><g transform="translate(230.0 100.0)"><g class="r1-c"><rect x="-33.8" y="-14" width="67.6" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">Docker</text></g></g></g>
<g class="r2"><g transform="translate(384.7 265.4)"><g class="r2-c"><rect x="-51.0" y="-14" width="102.0" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">JavaScript</text></g></g><g transform="translate(250.7 366.7)"><g class="r2-c"><rect x="-25.2" y="-14" width="50.4" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">Java</text></g></g><g transform="translate(96.0 301.3)"><g class="r2-c"><rect x="-16.6" y="-14" width="33.2" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">C#</text></g></g><g transform="translate(75.3 134.6)"><g class="r2-c"><rect x="-20.9" y="-14" width="41.8" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">C++</text></g></g><g transform="translate(209.3 33.3)"><g class="r2-c"><rect x="-12.3" y="-14" width="24.6" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">C</text></g></g><g transform="translate(364.0 98.7)"><g class="r2-c"><rect x="-20.9" y="-14" width="41.8" height="28" rx="14" fill="#0B1220" stroke="url(#chip)" stroke-width="1.4"/><text y="5" text-anchor="middle" class="chip">Git</text></g></g></g>
<text x="500" y="70" class="h">Tech Arsenal</text>
<text x="500" y="98" class="sub">The stack I use to ship production-grade products</text>
<text x="500" y="150" class="cat" fill="#22D3EE" style="animation-delay:0.30s">Frontend</text><line x1="500" y1="162" x2="950" y2="162" stroke="#22D3EE" stroke-opacity=".25"/><line x1="500" y1="162" x2="950" y2="162" stroke="#22D3EE" stroke-width="2" class="bar" style="animation-delay:0.40s"/><g class="pill" style="animation-delay:0.70s"><rect x="500" y="174" width="64.0" height="28" rx="8" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".55"/><text x="532.0" y="193" text-anchor="middle" class="pt">React</text></g><g class="pill" style="animation-delay:0.82s"><rect x="574.0" y="174" width="106.0" height="28" rx="8" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".55"/><text x="627.0" y="193" text-anchor="middle" class="pt">JavaScript</text></g><g class="pill" style="animation-delay:0.94s"><rect x="690.0" y="174" width="55.6" height="28" rx="8" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".55"/><text x="717.8" y="193" text-anchor="middle" class="pt">HTML</text></g><g class="pill" style="animation-delay:1.06s"><rect x="755.6" y="174" width="47.2" height="28" rx="8" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".55"/><text x="779.2" y="193" text-anchor="middle" class="pt">CSS</text></g><text x="500" y="232" class="cat" fill="#34D399" style="animation-delay:0.65s">Backend</text><line x1="500" y1="244" x2="950" y2="244" stroke="#34D399" stroke-opacity=".25"/><line x1="500" y1="244" x2="950" y2="244" stroke="#34D399" stroke-width="2" class="bar" style="animation-delay:0.75s"/><g class="pill" style="animation-delay:1.05s"><rect x="500" y="256" width="80.8" height="28" rx="8" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".55"/><text x="540.4" y="275" text-anchor="middle" class="pt">Node.js</text></g><g class="pill" style="animation-delay:1.17s"><rect x="590.8" y="256" width="72.4" height="28" rx="8" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".55"/><text x="627.0" y="275" text-anchor="middle" class="pt">Python</text></g><g class="pill" style="animation-delay:1.29s"><rect x="673.1999999999999" y="256" width="55.6" height="28" rx="8" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".55"/><text x="701.0" y="275" text-anchor="middle" class="pt">Java</text></g><g class="pill" style="animation-delay:1.41s"><rect x="738.8" y="256" width="38.8" height="28" rx="8" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".55"/><text x="758.2" y="275" text-anchor="middle" class="pt">C#</text></g><text x="500" y="314" class="cat" fill="#A78BFA" style="animation-delay:1.00s">Systems</text><line x1="500" y1="326" x2="950" y2="326" stroke="#A78BFA" stroke-opacity=".25"/><line x1="500" y1="326" x2="950" y2="326" stroke="#A78BFA" stroke-width="2" class="bar" style="animation-delay:1.10s"/><g class="pill" style="animation-delay:1.40s"><rect x="500" y="338" width="30.4" height="28" rx="8" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/><text x="515.2" y="357" text-anchor="middle" class="pt">C</text></g><g class="pill" style="animation-delay:1.52s"><rect x="540.4" y="338" width="47.2" height="28" rx="8" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/><text x="564.0" y="357" text-anchor="middle" class="pt">C++</text></g><g class="pill" style="animation-delay:1.64s"><rect x="597.6" y="338" width="72.4" height="28" rx="8" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/><text x="633.8" y="357" text-anchor="middle" class="pt">Docker</text></g><g class="pill" style="animation-delay:1.76s"><rect x="680.0" y="338" width="47.2" height="28" rx="8" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/><text x="703.6" y="357" text-anchor="middle" class="pt">Git</text></g>

</svg>
