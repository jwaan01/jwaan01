<svg width="1100" height="240" viewBox="0 0 1100 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Let&#x27;s Build Something">
<title>Let&#x27;s Build Something</title>
<style>

.h{font:700 32px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F1F5F9}
.sub{font:400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.ct{font:700 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#F8FAFC}
.cd{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#94A3B8}
.card{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.ic{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.ul{stroke-dasharray:120;stroke-dashoffset:120;animation:ul 1s ease .3s forwards}
@keyframes ul{to{stroke-dashoffset:0}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-400px) skewX(-20deg)}50%,100%{transform:translateX(1400px) skewX(-20deg)}}
.comet{stroke-dasharray:90 910;stroke-dashoffset:1000;animation:comet linear infinite}@keyframes comet{to{stroke-dashoffset:0}}.pg{animation:pg 2.4s ease-out infinite}@keyframes pg{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important}}
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="240" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1020"/><stop offset="1" stop-color="#1E293B"/>
  </linearGradient>
  <linearGradient id="cardF" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="1100" height="240" rx="22"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#clip)">
  <rect width="1100" height="240" fill="url(#bg)"/>
  <text x="48" y="60" class="h">Let&#x27;s Build Something</text>
  <line x1="48" y1="74" x2="168" y2="74" stroke="#22C55E" stroke-width="3" stroke-linecap="round" class="ul"/>
  <text x="48" y="100" class="sub">Open for freelance collaborations and long-term projects</text>
  <g class="card" style="animation-delay:0.20s"><rect x="40" y="126" width="320" height="78" rx="14" fill="#0F172A"/><path d="M54,126 H346 A14,14 0 0 1 360,140 V190 A14,14 0 0 1 346,204 H54 A14,14 0 0 1 40,190 V140 A14,14 0 0 1 54,126 Z" stroke="#3B82F6" stroke-opacity="0.28" stroke-width="1.2"/><path d="M54,126 H346 A14,14 0 0 1 360,140 V190 A14,14 0 0 1 346,204 H54 A14,14 0 0 1 40,190 V140 A14,14 0 0 1 54,126 Z" pathLength="1000" class="comet" stroke="#3B82F6" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:4.5s;animation-delay:0.0s"/><circle cx="78" cy="165" r="22" fill="none" stroke="#3B82F6" class="pg" style="animation-delay:0.0s;transform-origin:78px 165px"/><circle cx="78" cy="165" r="22" fill="#3B82F6" fill-opacity=".12"/><g transform="translate(78 165)"><g class="ic" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0 -11 A11 11 0 0 0 -3.5 10.4 V6 C-7 7 -8 4 -9 3 M3.5 10.4 V5 C3.5 3 3 2 2 1.5 C6 1 8 -1 8 -5 C8 -7 7 -8 6.5 -8.5 C7 -10 6.5 -11 6.5 -11 C5 -11 3.5 -10 3 -9.5 A12 12 0 0 0 -3 -9.5 C-3.5 -10 -5 -11 -6.5 -11 C-6.5 -11 -7 -10 -6.5 -8.5 C-7 -8 -8 -7 -8 -5 C-8 -1 -6 1 -2 1.5"/></g></g><text x="114" y="160" class="ct">GitHub</text><text x="114" y="182" class="cd">github.com/jwaan01</text></g><g class="card" style="animation-delay:0.38s"><rect x="390" y="126" width="320" height="78" rx="14" fill="#0F172A"/><path d="M404,126 H696 A14,14 0 0 1 710,140 V190 A14,14 0 0 1 696,204 H404 A14,14 0 0 1 390,190 V140 A14,14 0 0 1 404,126 Z" stroke="#22C55E" stroke-opacity="0.28" stroke-width="1.2"/><path d="M404,126 H696 A14,14 0 0 1 710,140 V190 A14,14 0 0 1 696,204 H404 A14,14 0 0 1 390,190 V140 A14,14 0 0 1 404,126 Z" pathLength="1000" class="comet" stroke="#22C55E" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:5.1s;animation-delay:-1.5s"/><circle cx="428" cy="165" r="22" fill="none" stroke="#22C55E" class="pg" style="animation-delay:0.6s;transform-origin:428px 165px"/><circle cx="428" cy="165" r="22" fill="#22C55E" fill-opacity=".12"/><g transform="translate(428 165)"><g class="ic" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-12" y="-8" width="24" height="16" rx="3"/><path d="M-12 -6 L0 3 L12 -6"/></g></g><text x="464" y="160" class="ct">Email</text><text x="464" y="182" class="cd">aovkiz123@gmail.com</text></g><g class="card" style="animation-delay:0.56s"><rect x="740" y="126" width="320" height="78" rx="14" fill="#0F172A"/><path d="M754,126 H1046 A14,14 0 0 1 1060,140 V190 A14,14 0 0 1 1046,204 H754 A14,14 0 0 1 740,190 V140 A14,14 0 0 1 754,126 Z" stroke="#0EA5E9" stroke-opacity="0.28" stroke-width="1.2"/><path d="M754,126 H1046 A14,14 0 0 1 1060,140 V190 A14,14 0 0 1 1046,204 H754 A14,14 0 0 1 740,190 V140 A14,14 0 0 1 754,126 Z" pathLength="1000" class="comet" stroke="#0EA5E9" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)" style="animation-duration:5.7s;animation-delay:-3.0s"/><circle cx="778" cy="165" r="22" fill="none" stroke="#0EA5E9" class="pg" style="animation-delay:1.2s;transform-origin:778px 165px"/><circle cx="778" cy="165" r="22" fill="#0EA5E9" fill-opacity=".12"/><g transform="translate(778 165)"><g class="ic" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-11" y="-11" width="22" height="22" rx="4"/><path d="M-6 -2 V6 M-6 -6 V-5.5 M-1 6 V-2 M-1 1 C-1 -2 5 -3 5 1 V6"/></g></g><text x="814" y="160" class="ct">LinkedIn</text><text x="814" y="182" class="cd">Quan Huynh</text></g>
  <rect class="shine" x="0" y="0" width="160" height="240" fill="url(#sh)"/>
</g>

</svg>
