.fb{transform-box:fill-box;transform-origin:center}
.spd{animation:spd linear infinite}
@keyframes spd{from{transform:translateX(160px);opacity:0}20%{opacity:1}to{transform:translateX(-220px);opacity:0}}
.jit{animation:jit .32s steps(1) infinite}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-1px,2px)}75%{transform:translate(-2px,-1px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick 1.6s steps(2) infinite}
@keyframes flick{50%{opacity:.55}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
@keyframes pop{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:none}}
@keyframes slamL{from{transform:translateX(-120%)}to{transform:none}}
@keyframes slamR{from{transform:translateX(110%)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}


.on{opacity:0;animation:on 6.6000000000000005s steps(1) infinite}
@keyframes on{0%{opacity:0}66.67%{opacity:1}100.00%,100%{opacity:0}}
.off{animation:off 6.6000000000000005s steps(1) infinite}
@keyframes off{0%{opacity:1}66.67%{opacity:0}100.00%,100%{opacity:1}}
.go{animation:nudge .9s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}

@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}}</style>
<defs><pattern id="tone" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#0f0f14"/></pattern><pattern id="toneW" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#ffffff"/></pattern><pattern id="toneF" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" fill="#0f0f14"/></pattern><linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#fff"/><stop offset=".75" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="cp"><polygon points="30.0,8.0 964.0,8.0 948.0,74.0 14.0,74.0"/></clipPath></defs>

