<style>@font-face{font-family:HTHead;font-weight:900;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:HTLabel;font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:HTBody;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:HTBodySemi;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.sfx{font-family:HTSfx,'Arial Black', Impact, sans-serif}
.hd{font-family:HTHead,'Arial Narrow', Impact, sans-serif;font-weight:900;font-style:italic;text-transform:uppercase}
.lb{font-family:HTLabel,'Arial Narrow', Arial, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:2px}
.bd{font-family:HTBody,'Segoe UI', Arial, sans-serif;font-weight:400}
