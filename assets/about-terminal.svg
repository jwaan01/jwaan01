iming-function:steps(12,end)}32.05%{opacity:1;transform:translateX(122.39999999999999px)}33.18%,100%{opacity:0;transform:translateX(122.39999999999999px)}}@keyframes s8{0%,26.86%{opacity:0}26.91%,100%{opacity:1}}@keyframes o9{0%,34.09%{opacity:0;transform:translateX(-8px)}35.23%,100%{opacity:1;transform:none}}@keyframes fin{0%,36.82%{opacity:0}36.86%,100%{opacity:1}}

