99999999998" lengthAdjust="spacingAndGlyphs" clip-path="url(#cp6)">ls ~/languages</text><rect x="65" y="280" width="9" height="20" fill="#34D399" style="opacity:0;animation:ck6 22.0s infinite"/></g><text x="64" y="330" class="mono" fill="#FBBF24" xml:space="preserve" style="opacity:0;animation:o7 22.0s ease infinite">C  C++  C#  Java  JavaScript  Python</text><g><text x="40" y="364" class="mono prompt" style="opacity:0;animation:s8 22.0s infinite">❯</text><clipPath id="cp8"><rect x="64" y="344" width="124.39999999999999" height="28" style="transform-origin:64px 0;animation:k8 22.0s infinite"/></clipPath><text x="64" y="364" class="mono cmd" textLength="122.39999999999999" lengthAdjust="spacingAndGlyphs" clip-path="url(#cp8)">status --now</text><rect x="65" y="348" width="9" height="20" fill="#34D399" style="opacity:0;animation:ck8 22.0s infinite"/></g><text x="64" y="398" class="mono" fill="#6EE7B7" xml:space="preserve" style="opacity:0;animation:o9 22.0s ease infinite">●  Open for freelance &amp; long-term collaborations</text><g style="opacity:0;animation:fin 22.0s infinite"><text x="40" y="432" class="mono" fill="#34D399">❯</text><rect x="65" y="416" width="9" height="20" fill="#34D399" class="blink"/></g></g>
